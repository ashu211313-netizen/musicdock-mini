name: Package release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: ./scripts/package.ps1
        shell: pwsh
      - run: npx playwright install chromium
      - run: npm run test:browser
      - name: Upload release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME dist/musicdock-mini-1.1.0.zip dist/SHA256SUMS.txt --title "MusicDock Mini $env:GITHUB_REF_NAME" --notes-file CHANGELOG.md
